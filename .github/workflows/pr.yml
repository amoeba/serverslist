name: Check PR

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
    - name: Checkout ac-server-monitor
      uses: actions/checkout@v4
      with:
        repository: 'amoeba/ac-server-monitor'
        path: 'ac-server-monitor'
    - name: Build ac-server-monitor
      working-directory: ./ac-server-monitor
      run: go build
    - name: Fetch origin
      run: git fetch origin
    - name: Extract address and port
      id: extract
      run: |
        echo "CHECK_ADDRESS=$(git diff HEAD..HEAD~1 | grep -E "^[+]{1} " | grep -E "server_host" | grep -o -E ">([^<]+)<" | grep -o -E "[^<>]+" | head -n 1)" >> "$GITHUB_OUTPUT"
        echo "CHECK_PORT=$(git diff HEAD..HEAD~1 | grep -A 1 -E "^[+]{1} " | grep -E "server_port" | grep -o -E "\d+" | head -n 1)" >> "$GITHUB_OUTPUT"
    - name: Check server
      env:
        CHECK_ADDRESS: ${{ steps.extract.outputs.CHECK_ADDRESS }}
        CHECK_PORT: ${{ steps.extract.outputs.CHECK_PORT }}
      working-directory: ./ac-server-monitor
      run: ./monitor -check $CHECK_ADDRESS:$CHECK_PORT
